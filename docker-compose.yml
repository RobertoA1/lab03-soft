version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agrotech_postgres
    environment:
      POSTGRES_DB: agrotech
      POSTGRES_USER: agrotech
      POSTGRES_PASSWORD: agrotech_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agrotech']
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n
    container_name: agrotech_n8n
    environment:
      N8N_BASIC_AUTH_ACTIVE: 'true'
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: agrotech
      DB_POSTGRESDB_PASSWORD: agrotech_pass
      WEBHOOK_URL: http://localhost:5678
      # --- Variables usadas por workflows de alertas (ajustar antes de activar) ---
      # Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # JWT emitido por el backend para que n8n consulte tRPC protegido
      BACKEND_JWT_TOKEN: ${BACKEND_JWT_TOKEN:-}
      # EmailJS (https://dashboard.emailjs.com) -- usado por "Send Email"
      EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID:-}
      EMAILJS_TEMPLATE_ID: ${EMAILJS_TEMPLATE_ID:-}
      EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY:-}
      EMAILJS_PRIVATE_KEY: ${EMAILJS_PRIVATE_KEY:-}
      # Evolution API (WhatsApp) -- usado por "Send WhatsApp"
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
    ports:
      - '5678:5678'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
