<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroTech - Historico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f8fafc] text-[#1a1f2b]">
  <div class="min-h-screen flex">
    <aside class="w-[260px] bg-[#251f47] flex flex-col fixed h-full z-30 flex-shrink-0">
      <div class="h-12 flex items-center gap-3 px-6 border-b border-white/10">
        <div class="w-8 h-8 rounded-lg bg-[#86cb92] flex items-center justify-center"><iconify-icon icon="lucide:leaf" class="text-white text-lg"></iconify-icon></div>
        <span class="text-[#f0f9f4] font-bold text-lg tracking-tight">AgroTech</span>
      </div>
      <nav id="sidebar-container" class="flex-1 px-4 py-6 space-y-1 overflow-y-auto"></nav>
      <div class="p-4 border-t border-white/10">
        <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-full bg-[#404e7c] flex items-center justify-center text-[#f0f9f4] font-semibold text-sm">JD</div><div><p class="text-[#f0f9f4] text-sm font-medium">John Doe</p><p class="text-[#f0f9f4]/50 text-xs">Agronomo</p></div></div>
      </div>
    </aside>
    <div class="flex-1 flex flex-col ml-[260px] min-w-0">
      <header class="sticky top-0 z-20 bg-white border-b border-[#e2e8f0] h-14 flex items-center justify-between px-6">
        <h1 class="text-[1.5rem] font-bold tracking-tight">Historico</h1>
        <button id="header-notifications" class="relative p-2 rounded-full hover:bg-[#f1f5f9]"><iconify-icon icon="lucide:bell" class="text-[#64748b] text-xl"></iconify-icon></button>
      </header>
      <main class="flex-1 p-6 overflow-y-auto">
        <div class="max-w-[1440px] mx-auto space-y-5">

          <div class="bg-white rounded-xl shadow-sm border border-[#f1f5f9] p-4 flex flex-wrap gap-3 items-center">
            <span class="text-xs font-semibold text-[#64748b] uppercase tracking-wider">Filtros:</span>
            <select id="f-cultivo" class="text-sm border border-[#e2e8f0] rounded-lg px-3 py-1.5 bg-white"><option value="">Todos los cultivos</option></select>
            <select id="f-temporada" class="text-sm border border-[#e2e8f0] rounded-lg px-3 py-1.5 bg-white"><option value="">Todas las temporadas</option></select>
            <select id="f-lote" class="text-sm border border-[#e2e8f0] rounded-lg px-3 py-1.5 bg-white"><option value="">Todos los lotes</option></select>
            <button id="btn-clear" class="ml-auto text-sm text-[#64748b] hover:text-[#86cb92]">Limpiar filtros</button>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4" id="charts-grid"></div>

          <div class="bg-white rounded-xl shadow-sm border border-[#f1f5f9] p-5">
            <h2 class="text-[1.125rem] font-semibold mb-3">Produccion por temporada</h2>
            <div id="chart-produccion" class="w-full h-[260px]"></div>
            <div id="produccion-detail" class="mt-4 text-sm text-[#64748b]"></div>
          </div>

        </div>
      </main>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/historico.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => { window.AgroApp.renderSidebar('historico'); window.AgroApp.updateNotificationBadge(); });</script>
</body>
</html>
